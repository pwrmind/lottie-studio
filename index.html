<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 LSL Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
    <link rel="stylesheet" href="./assets/styles/main.css">
  </head>
  <body>
    <div class="workspace">
      <!-- ============ ЛЕВАЯ ПАНЕЛЬ: LSL-DSL ============ -->
      <section class="panel">
        <div class="toolbar">
          <span class="toolbar-title">LSL Сценарий</span>
          <button class="primary" id="btn-compile" title="Ctrl + Enter">▶ Собрать</button>
          <button id="btn-save-dsl" title="Скачать файл .lsl">💾 Сохранить DSL</button>
          <button id="btn-load-dsl" title="Загрузить скрипт">📂 Открыть</button>
          <button id="btn-reset-dsl" title="Вернуть демо-пример">↺ Пример</button>
          <input type="file" id="file-dsl" accept=".lsl,.txt" style="display:none">
        </div>
        <textarea class="code-area" id="dsl-editor" spellcheck="false"></textarea>
        <div class="error-banner" id="error-box"></div>
      </section>

      <!-- ============ ПРАВАЯ ПАНЕЛЬ: LOTTIE & RAW ============ -->
      <section class="panel">
        <div class="toolbar">
          <span class="toolbar-title">Lottie Студия</span>
          <div class="tabs">
            <button class="active" id="tab-preview">🎬 Превью</button>
            <button id="tab-raw">{ } Raw Lottie</button>
          </div>
          <button id="btn-save-lottie">⬇ Lottie .json</button>
          <button class="danger" id="btn-export-video">⏺ Видео</button>
        </div>

        <div class="view-container">
          <div class="stage-wrap" id="stage-wrap">
            <div id="lottie-box"></div>
          </div>
          <pre class="raw-json" id="raw-json-view"></pre>
        </div>

        <div class="player-bar">
          <button id="btn-play">⏸ Пауза</button>
          <input type="range" id="scrubber" min="0" max="100" value="0" step="1">
          <span class="timecode" id="timecode">0.00 / 0.00s</span>
          <span class="rec-badge" id="rec-badge"><span class="dot"></span>Рендер видео…</span>
        </div>
      </section>
    </div>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
