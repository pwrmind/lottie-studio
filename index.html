<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 LSL Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1117;
    --panel: #161922;
    --panel2: #1e222d;
    --border: #2b3040;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }
  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
    height: 100vh;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--accent);
    margin-right: auto;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.15s;
  }
  button:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.primary {
    background: var(--accent);
    color: #090d16;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) {
    background: var(--accent-hover);
    color: #fff;
  }
  button.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--danger);
    color: #fca5a5;
  }
  button.danger:hover:not(:disabled) {
    background: var(--danger);
    color: #fff;
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .tabs {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .tabs button {
    border: none;
    border-radius: 0;
    padding: 5px 10px;
    background: transparent;
    color: var(--text-dim);
  }
  .tabs button.active {
    background: var(--accent);
    color: #090d16;
    font-weight: 600;
  }

  /* Левая панель: редактор DSL */
  textarea.code-area {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--bg);
    color: #cbd5e1;
    font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
    padding: 14px;
    tab-size: 2;
  }
  .error-banner {
    display: none;
    padding: 8px 14px;
    background: #3b1219;
    color: #fda4af;
    border-top: 1px solid #be123c;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
  .error-banner.visible { display: block; }

  /* Правая панель: превью и raw JSON */
  .view-container {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #090b10;
  }
  .stage-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    background-image: radial-gradient(#1e2433 1px, transparent 1px);
    background-size: 16px 16px;
  }
  #lottie-box {
    background: #111520;
    border: 2px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lottie-box svg {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }
  .raw-json {
    flex: 1;
    margin: 0;
    padding: 14px;
    overflow: auto;
    background: var(--bg);
    color: #86efac;
    font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.5;
    display: none;
  }
  .player-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--panel2);
    border-top: 1px solid var(--border);
  }
  .player-bar input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .timecode {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--accent);
    min-width: 95px;
    text-align: right;
  }
  .rec-badge {
    display: none;
    align-items: center;
    gap: 6px;
    color: #fca5a5;
    font-size: 12px;
    font-weight: 600;
  }
  .rec-badge.on { display: inline-flex; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger);
    animation: pulse 0.9s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.2; } }
</style>
</head>
<body>

<div class="workspace">
  <!-- ============ ЛЕВАЯ ПАНЕЛЬ: LSL-DSL ============ -->
  <section class="panel">
    <div class="toolbar">
      <span class="toolbar-title">LSL Сценарий</span>
      <button class="primary" id="btn-compile" title="Ctrl + Enter">▶ Собрать</button>
      <button id="btn-save-dsl" title="Скачать файл .lsl">💾 Сохранить DSL</button>
      <button id="btn-load-dsl" title="Загрузить скрипт">📂 Открыть</button>
      <button id="btn-reset-dsl" title="Вернуть демо-пример">↺ Пример</button>
      <input type="file" id="file-dsl" accept=".lsl,.txt" style="display:none">
    </div>
    <textarea class="code-area" id="dsl-editor" spellcheck="false"></textarea>
    <div class="error-banner" id="error-box"></div>
  </section>

  <!-- ============ ПРАВАЯ ПАНЕЛЬ: LOTTIE & RAW ============ -->
  <section class="panel">
    <div class="toolbar">

  </section>

/* ============================================================================
 * 2. БАЗОВЫЕ УТИЛИТЫ ПАРСЕРА
 * ========================================================================== */

/** Разделяет строку по разделителю, игнорируя его внутри кавычек и скобок. */
function splitTopLevel(str, sep = ',') {
  const parts = [];
  let current = '';
  let quote = null;
  let depth = 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (quote) {
      current += ch;
      if (ch === quote && str[i - 1] !== '\\') quote = null;
    } else if (ch === "'" || ch === '"') {
      quote = ch;
      current += ch;
    } else if (ch === '(' || ch === '[') {
      depth++;
      current += ch;
    } else if (ch === ')' || ch === ']') {
      depth--;
      current += ch;
    } else if (ch === sep && depth === 0) {
      parts.push(current.trim());
      current = '';
    } else {
      current += ch;
    }
  }
  if (current.trim()) parts.push(current.trim());
  return parts;
}

/** Срезает внешние скобки: "(a, b)" -> "a, b". */
function stripParens(str) {
  const t = str.trim();
  return t.startsWith('(') && t.endsWith(')') ? t.slice(1, -1) : t;
}

/** '123' -> "123", "'текст'" -> текст, "true" -> true и массивы вида "[0.25, 0.1, 0.25, 1.0]". */
function parseValue(raw) {
  const s = raw.trim();
  if ((s.startsWith("'") && s.endsWith("'")) || (s.startsWith('"') && s.endsWith('"'))) {
    return s.slice(1, -1);
  }
  if (s.startsWith('[') && s.endsWith(']')) {
    const inner = s.slice(1, -1).trim();
    return inner ? splitTopLevel(inner).map(parseValue) : [];
  }
  if (s === 'true') return true;
  if (s === 'false') return false;
  const num = Number(s);
  return s !== '' && !isNaN(num) ? num : s;
}

/** "x = 10, color = '#fff'" -> { x: 10, color: '#fff' }. */
function parseAssignments(str) {
  const obj = {};
  for (const part of splitTopLevel(str)) {
    const eq = part.indexOf('=');
    if (eq === -1) throw new Error('Ожидалось присваивание "ключ = значение" в: ' + part);
    obj[part.slice(0, eq).trim()] = parseValue(part.slice(eq + 1));
  }
  return obj;
}

/** Убирает комментарий "-- ..." с учётом кавычек. */
function stripLineComment(line) {
  let quote = null;
  for (let i = 0; i < line.length - 1; i++) {
    const ch = line[i];
    if (quote) {
      if (ch === quote && line[i - 1] !== '\\') quote = null;
    } else if (ch === "'" || ch === '"') {
      quote = ch;
    } else if (ch === '-' && line[i + 1] === '-') {
      return line.slice(0, i);
    }
  }
  return line;
}

/** Возвращает индекс парной скобки к openIndex (без учёта вложенности не нужен). */
function findClosingParen(text, openIndex) {
  let quote = null;
  let depth = 0;
  for (let i = openIndex; i < text.length; i++) {
    const ch = text[i];
    if (quote) {
      if (ch === quote && text[i - 1] !== '\\') quote = null;
    } else if (ch === "'" || ch === '"') {
      quote = ch;
    } else if (ch === '(') {
      depth++;
    } else if (ch === ')' && --depth === 0) {
      return i;
    }
  }
  return text.length - 1;
}

/**
 * Находит ключевые слова вне кавычек и скобочных групп: [{ word, index }].
 * Используется, чтобы надёжно отделить опциональные части UPDATE
 * (WHERE / AT / WITH), даже если значения содержат похожие слова в кавычках.
 */
function findTopLevelKeywords(text, words) {
  const found = [];
  const upper = text.toUpperCase();
  let quote = null;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quote) {
      if (ch === quote && text[i - 1] !== '\\') quote = null;
      continue;
    }
    if (ch === "'" || ch === '"') { quote = ch; continue; }
    if (ch === '(') { i = findClosingParen(text, i); continue; }

    const startsWord = i === 0 || /\s/.test(text[i - 1]);
    if (!startsWord) continue;
    for (const w of words) {
      const end = i + w.length;
      if (upper.startsWith(w, i) && (end >= text.length || /\s/.test(text[end]))) {
        found.push({ word: w, index: i });
        i = end - 1;
        break;
      }
    }
  }
  return found;
}

/** Разбирает хвост UPDATE: SET-часть плюс необязательные WHERE / AT / WITH (...). */
function splitUpdateTail(rest) {
  const marks = findTopLevelKeywords(rest, ['WHERE', 'AT', 'WITH'])
    .sort((a, b) => a.index - b.index);
  const tail = { set: '', where: null, at: 0, with: {} };

  for (let i = 0; i < marks.length; i++) {
    const { word, index } = marks[i];
    const next = i + 1 < marks.length ? marks[i + 1].index : rest.length;
    const segment = rest.slice(index + word.length, next).trim();
    if (i === 0) tail.set = rest.slice(0, index).trim();

    if (word === 'AT') {
      tail.at = parseFloat(segment) || 0;
    } else if (word === 'WITH') {
      tail.with = parseAssignments(stripParens(segment));
    } else {
      tail.where = segment;
    }
  }
  if (!marks.length) tail.set = rest.trim();
  return tail;
}

/** 3. Приводит SET/AT/WITH к единому объекту события анимации. */
function makeUpdate(setPart, atTime, withObj) {
  const delay = Number(withObj.delay ?? 0);
  return {
    t: (atTime || 0) + delay,
    dur: Number(withObj.duration ?? withObj.dur ?? 0),
    ease: withObj.ease ?? 'inOut',
    repeat: Math.max(0, Math.floor(Number(withObj.repeat ?? 0))),
    yoyo: Boolean(withObj.yoyo ?? false),
    set: parseAssignments(setPart),
  };
}

/* ============================================================================
 * 3. ПАРСЕР LSL
 * ========================================================================== */

const DEFAULT_LAYER = {
  type: 'rect', x: 0, y: 0, width: 100, height: 100,
  scale: 100, rotation: 0, opacity: 100, color: '#ffffff',
  radius: 0, text: '', size: 24, font: 'Arial', fixed: false,
};

function tryParseInsert(stmt, layers) {
  const match = stmt.match(/^INSERT\s+INTO\s+layers\s*\(([^)]+)\)\s*VALUES\s*(.+)$/is);
  if (!match) return false;

  const columns = splitTopLevel(match[1]).map((c) => c.trim());
  for (const tuple of splitTopLevel(match[2])) {
    const values = splitTopLevel(stripParens(tuple)).map(parseValue);
    if (values.length !== columns.length) {
      throw new Error(
        `Количество значений (${values.length}) не совпадает с колонками (${columns.length})`
      );
    }
    const layer = { ...DEFAULT_LAYER };
    columns.forEach((col, i) => { layer[col] = values[i]; });
    if (!layer.id) throw new Error('У каждого слоя в INSERT должен быть указан id');
    layers.set(layer.id, layer);
  }
  return true;
}

function tryParseCompositionUpdate(stmt, comp) {
  const match = stmt.match(/^UPDATE\s+composition\s+SET\s+(.+)$/is);
  if (!match) return false;
  Object.assign(comp, parseAssignments(match[1]));
  return true;
}

function tryParseCameraUpdate(stmt, out) {
  const match = stmt.match(/^UPDATE\s+camera\s+SET\s+(.+)$/is);
  if (!match) return false;
  const tail = splitUpdateTail(match[1]);
  out.push(makeUpdate(tail.set, tail.at, tail.with));
  return true;
}

/** Компилирует строку условия WHERE в функцию (layer) => boolean. */
function compileWherePredicate(whereStr) {
  const orParts = whereStr.split(/\s+OR\s+/i);
  const orFuncs = orParts.map((orPart) => {
    const andParts = orPart.split(/\s+AND\s+/i);
    const andFuncs = andParts.map((cond) => {
      const c = cond.trim();

      // 1. col IN ('a', 'b')
      let m = c.match(/^(\w+)\s+IN\s*\((.+)\)$/i);
      if (m) {
        const [, col, listStr] = m;
        const list = splitTopLevel(listStr).map(parseValue);
        return (layer) => list.includes(layer[col]);
      }

      // 2. col LIKE 'prefix%'
      m = c.match(/^(\w+)\s+LIKE\s+(.+)$/i);
      if (m) {
        const [, col, rawPattern] = m;
        const pat = String(parseValue(rawPattern))
          .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          .replace(/%/g, '.*')
          .replace(/_/g, '.');
        const re = new RegExp('^' + pat + '$', 'i');
        return (layer) => re.test(String(layer[col] ?? ''));
      }

      // 3. col (= | != | <> | >= | <= | > | <) value
      m = c.match(/^(\w+)\s*(!=|<>|>=|<=|=|>|<)\s*(.+)$/);
      if (m) {
        const [, col, op, rawVal] = m;
        const val = parseValue(rawVal);
        return (layer) => {
          const cur = layer[col];
          switch (op) {
            case '=':  return cur === val;
            case '!=':
            case '<>': return cur !== val;
            case '>':  return cur > val;
            case '<':  return cur < val;
            case '>=': return cur >= val;
            case '<=': return cur <= val;
            default:   return false;
          }
        };
      }

      throw new Error('Неподдерживаемое условие WHERE: ' + c);
    });
    return (layer) => andFuncs.every((fn) => fn(layer));
  });
  return (layer) => orFuncs.some((fn) => fn(layer));
}

function tryParseLayerUpdate(stmt, out) {
  const match = stmt.match(/^UPDATE\s+layers\s+SET\s+(.+)$/is);
  if (!match) return false;

  const tail = splitUpdateTail(match[1]);
  const update = makeUpdate(tail.set, tail.at, tail.with);
  update.matchFn = tail.where ? compileWherePredicate(tail.where) : () => true;

  out.push(update);
  return true;
}


function parseDSL(text) {
  const cleaned = text.split('\n').map(stripLineComment).join('\n');
  const statements = splitTopLevel(cleaned, ';');

  const comp = { width: 540, height: 960, fps: 60, duration: 5.0 };
  const layers = new Map();
  const updates = [];
  const cameraUpdates = [];

  for (const raw of statements) {
    const stmt = raw.trim();
    if (!stmt) continue;
    if (tryParseInsert(stmt, layers)) continue;
    if (tryParseCompositionUpdate(stmt, comp)) continue;
    if (tryParseCameraUpdate(stmt, cameraUpdates)) continue;
    if (tryParseLayerUpdate(stmt, updates)) continue;
    throw new Error('Неизвестная инструкция LSL: ' + stmt.slice(0, 60));
  }

  return { comp, layers, updates, cameraUpdates };
}

/* ============================================================================
 * 4. КОМПИЛЯТОР В LOTTIE JSON (2D-камера + динамические шрифты)
 * ========================================================================== */

const bezier = (ix, iy, ox, oy) => ({ i: { x: [ix], y: [iy] }, o: { x: [ox], y: [oy] } });

// Порядок аргументов bezier(x2, y2, x1, y1) для CSS cubic-bezier(x1, y1, x2, y2):
const EASING = {
  linear: bezier(1, 1, 0, 0),          // cubic-bezier(0, 0, 1, 1)
  in:     bezier(1, 1, 0.42, 0),       // cubic-bezier(0.42, 0, 1, 1)
  out:    bezier(0.58, 1, 0, 0),       // cubic-bezier(0, 0, 0.58, 1)
  inOut:  bezier(0.58, 1, 0.42, 0),    // cubic-bezier(0.42, 0, 0.58, 1)
};
const LINEAR = EASING.linear;

function hexToLottieColor(hex) {
  let c = String(hex).replace('#', '').trim();
  if (c.length === 3) c = [...c].map((x) => x + x).join('');
  const num = parseInt(c, 16);
  if (isNaN(num)) return [1, 1, 1, 1];
  return [
    ((num >> 16) & 255) / 255,
    ((num >> 8) & 255) / 255,
    (num & 255) / 255,
    1,
  ].map((v) => +v.toFixed(4));
}

function resolveEase(easeSpec) {
  if (Array.isArray(easeSpec) && easeSpec.length === 4) {
    const [x1, y1, x2, y2] = easeSpec.map(Number);
    // В Lottie: o = outgoing handle (x1, y1), i = incoming handle (x2, y2)
    return bezier(x2, y2, x1, y1);
  }
  return EASING[String(easeSpec)] || EASING.inOut;
}

/** Собирает Lottie-трек ключевых кадров с поддержкой repeat, yoyo и cubic-bezier. */
function buildKeyframes(events, initialVal, fps, isArray) {
  const make = (val) => (isArray ? val.slice() : [val]);
  const sorted = [...events].sort((a, b) => a.t - b.t);
  if (!sorted.length) return { a: 0, k: make(initialVal) };

  // Разворачиваем repeat / yoyo в последовательность атомарных переходов
  const expanded = [];
  let trackedVal = initialVal;

  for (const ev of sorted) {
    const fromVal = trackedVal;
    const toVal = ev.val;
    const cycles = (ev.repeat || 0) + 1;

    for (let c = 0; c < cycles; c++) {
      const startT = ev.t + c * ev.dur;
      if (ev.yoyo) {
        const isForward = c % 2 === 0;
        const target = isForward ? toVal : fromVal;
        expanded.push({ t: startT, dur: ev.dur, ease: ev.ease, val: target });
        trackedVal = target;
      } else {
        // При repeat без yoyo на каждом новом цикле сбрасываемся в fromVal
        if (c > 0) {
          expanded.push({ t: startT, dur: 0, ease: 'linear', val: fromVal });
        }
        expanded.push({ t: startT, dur: ev.dur, ease: ev.ease, val: toVal });
        trackedVal = toVal;
      }
    }
  }

  const kf = [];
  const last = () => kf[kf.length - 1];
  const push = (t, val, ease) => kf.push({ t, s: make(val), i: ease.i, o: ease.o });
  let curVal = initialVal;

  for (const ev of expanded) {
    const startFrame = Math.round(ev.t * fps);
    const durFrames = Math.round(ev.dur * fps);
    const endFrame = startFrame + durFrames;
    const ease = resolveEase(ev.ease);

    if (durFrames <= 0) {
      if (startFrame > 0) {
        const prev = startFrame - 1;
        if (!last() || last().t < prev) push(prev, curVal, LINEAR);
      }
      if (last() && last().t === startFrame) {
        Object.assign(last(), { s: make(ev.val), i: LINEAR.i, o: LINEAR.o });
      } else {
        push(startFrame, ev.val, LINEAR);
      }
    } else {
      if (!last() || last().t < startFrame) {
        push(startFrame, curVal, ease);
      } else if (last().t === startFrame) {
        last().i = ease.i;
        last().o = ease.o;
      }
      push(endFrame, ev.val, LINEAR);
    }
    curVal = ev.val;
  }
  return { a: 1, k: kf };
}

/** Разбирает UPDATE-события одного слоя на анимационные каналы. */
function collectLayerEvents(layer, updates) {
  const channels = {
    pos: [],
    scale: [],
    rot: [],
    op: [],
    color: [],
    size: [],
    radius: [],
    text: [],
  };
  let curX = layer.x;
  let curY = layer.y;
  let curW = layer.width;
  let curH = layer.height;
  let curText = String(layer.text || '');
  let curColor = layer.color;

  const ev = (u, val) => ({
    t: u.t,
    dur: u.dur,
    ease: u.ease,
    repeat: u.repeat,
    yoyo: u.yoyo,
    val,
  });

  for (const u of updates) {
    if (u.matchFn && !u.matchFn(layer)) continue;
    const { set } = u;

    if (set.x !== undefined || set.y !== undefined) {
      curX = set.x !== undefined ? set.x : curX;
      curY = set.y !== undefined ? set.y : curY;
      channels.pos.push(ev(u, [curX, curY, 0]));
    }
    if (set.width !== undefined || set.height !== undefined) {
      curW = set.width !== undefined ? set.width : curW;
      curH = set.height !== undefined ? set.height : curH;
      channels.size.push(ev(u, [curW, curH]));
    }
    if (set.radius !== undefined) {
      channels.radius.push(ev(u, set.radius));
    }
    if (set.scale !== undefined) {
      const sc = set.scale;
      channels.scale.push(ev(u, [sc, sc, 100]));
    }
    if (set.rotation !== undefined) {
      channels.rot.push(ev(u, set.rotation));
    }
    if (set.opacity !== undefined) {
      channels.op.push(ev(u, set.opacity));
    }
    if (set.color !== undefined) {
      curColor = set.color;
      channels.color.push(ev(u, hexToLottieColor(curColor)));
    }
    if (set.text !== undefined || (layer.type === 'text' && set.color !== undefined)) {
      if (set.text !== undefined) curText = String(set.text);
      channels.text.push({ t: u.t, text: curText, color: curColor });
    }
  }
  return channels;
}


function createBaseLayer(name, ks, ind, totalFrames, camInd, fixed) {
  const layer = { ddd: 0, ind, nm: name, sr: 1, ks, ao: 0, ip: 0, op: totalFrames, st: 0, bm: 0 };
  if (!fixed) layer.parent = camInd;
  return layer;
}

function layerTransform(layer, channels, fps) {
  return {
    o: buildKeyframes(channels.op, layer.opacity, fps, false),
    r: buildKeyframes(channels.rot, layer.rotation, fps, false),
    p: buildKeyframes(channels.pos, [layer.x, layer.y, 0], fps, true),
    a: { a: 0, k: [0, 0, 0] },
    s: buildKeyframes(channels.scale, [layer.scale, layer.scale, 100], fps, true),
  };
}

function createShapeLayer(layer, channels, ind, totalFrames, fps, camInd) {
  const sizeTrack = buildKeyframes(channels.size, [layer.width, layer.height], fps, true);

  const geometry = layer.type === 'ellipse'
    ? { ty: 'el', d: 1, s: sizeTrack, p: { a: 0, k: [0, 0] }, nm: 'Ellipse' }
    : {
        ty: 'rc',
        d: 1,
        s: sizeTrack,
        p: { a: 0, k: [0, 0] },
        r: buildKeyframes(channels.radius, layer.radius || 0, fps, false),
        nm: 'Rectangle',
      };

  return {
    ...createBaseLayer(layer.id, layerTransform(layer, channels, fps), ind, totalFrames, camInd, layer.fixed),
    ty: 4,
    shapes: [{
      ty: 'gr',
      it: [
        geometry,
        {
          ty: 'fl',
          c: buildKeyframes(channels.color, hexToLottieColor(layer.color), fps, true),
          o: { a: 0, k: 100 },
          r: 1,
          bm: 0,
          nm: 'Fill',
        },
        {
          ty: 'tr',
          p: { a: 0, k: [0, 0] },
          a: { a: 0, k: [0, 0] },
          s: { a: 0, k: [100, 100] },
          r: { a: 0, k: 0 },
          o: { a: 0, k: 100 },
        },
      ],
      nm: 'Group',
    }],
  };
}

function createTextLayer(layer, channels, ind, totalFrames, fps, camInd) {
  const size = layer.size || 24;
  const fontName = resolveFontName(layer);

  const makeDocState = (txt, hexColor) => ({
    s: size,
    f: fontName,
    t: String(txt),
    j: 2,
    tr: 0,
    lh: size * 1.2,
    ls: 0,
    fc: hexToLottieColor(hexColor).slice(0, 3),
  });

  const textKeys = [{
    t: 0,
    s: makeDocState(layer.text || '', layer.color),
  }];

  const sortedTextEvents = [...channels.text].sort((a, b) => a.t - b.t);
  for (const item of sortedTextEvents) {
    const frame = Math.round(item.t * fps);
    const prev = textKeys[textKeys.length - 1];
    if (prev && prev.t === frame) {
      prev.s = makeDocState(item.text, item.color);
    } else {
      textKeys.push({
        t: frame,
        s: makeDocState(item.text, item.color),
      });
    }
  }

  return {
    ...createBaseLayer(layer.id, layerTransform(layer, channels, fps), ind, totalFrames, camInd, layer.fixed),
    ty: 5,
    t: {
      d: { k: textKeys },
      p: {},
      m: { g: 1, a: { a: 0, k: [0, 0] } },
      a: [],
    },
  };
}

/** Разбирает события камеры на каналы anchor (позиция) и scale (zoom * 100). */
function collectCameraEvents(comp, cameraUpdates) {
  const anchor = [];
  const scale = [];
  let curX = comp.width / 2;
  let curY = comp.height / 2;

  for (const u of [...cameraUpdates].sort((a, b) => a.t - b.t)) {
    if (u.set.x !== undefined || u.set.y !== undefined) {
      curX = u.set.x !== undefined ? u.set.x : curX;
      curY = u.set.y !== undefined ? u.set.y : curY;
      anchor.push({ t: u.t, dur: u.dur, ease: u.ease, val: [curX, curY, 0] });
    }
    if (u.set.zoom !== undefined) {
      const sc = u.set.zoom * 100;
      scale.push({ t: u.t, dur: u.dur, ease: u.ease, val: [sc, sc, 100] });
    }
  }
  return { anchor, scale };
}

/** Камера — это null-слой (ty: 3), к которому привязаны все обычные слои. */
function createCameraRig(comp, cameraUpdates, fps, totalFrames, camInd) {
  const { anchor, scale } = collectCameraEvents(comp, cameraUpdates);
  return {
    ddd: 0,
    ind: camInd,
    nm: 'CAMERA_RIG',
    ty: 3,
    sr: 1,
    ks: {
      o: { a: 0, k: 0 },
      r: { a: 0, k: 0 },
      p: { a: 0, k: [comp.width / 2, comp.height / 2, 0] },
      a: buildKeyframes(anchor, [comp.width / 2, comp.height / 2, 0], fps, true),
      s: buildKeyframes(scale, [100, 100, 100], fps, true),
    },
    ao: 0,
    ip: 0,
    op: totalFrames,
    st: 0,
    bm: 0,
  };
}

function resolveFontName(layer) {
  return String(layer.font || 'Arial').trim() || 'Arial';
}

function compileToLottie(parsed) {
  const comp = parsed.comp;
  const fps = comp.fps || 60;
  const totalFrames = Math.max(1, Math.round((comp.duration || 5) * fps));
  const CAM_IND = 9999;

  // В Lottie слои рисуются сверху вниз по массиву, поэтому разворачиваем порядок вставки
  const lottieLayers = [];
  let ind = 1;
  for (const layer of [...parsed.layers.values()].reverse()) {
    const channels = collectLayerEvents(layer, parsed.updates);
    const build = layer.type === 'text' ? createTextLayer : createShapeLayer;
    lottieLayers.push(build(layer, channels, ind++, totalFrames, fps, CAM_IND));
  }
  lottieLayers.push(createCameraRig(comp, parsed.cameraUpdates, fps, totalFrames, CAM_IND));

  const usedFonts = new Set();
  for (const layer of parsed.layers.values()) {
    if (layer.type === 'text') usedFonts.add(resolveFontName(layer));
  }
  if (!usedFonts.size) usedFonts.add('Arial');

  return {
    v: '5.12.2',
    fr: fps,
    ip: 0,
    op: totalFrames,
    w: comp.width,
    h: comp.height,
    nm: 'LSL_Camera_Animation',
    ddd: 0,
    assets: [],
    fonts: {
      list: [...usedFonts].map((fName) => ({
        fName,
        fFamily: fName,
        fStyle: 'Regular',
        ascent: 75,
      })),
    },
    layers: lottieLayers,
  };
}

/* ============================================================================
 * 5. ЗАГРУЗЧИК ШРИФТОВ (Google Fonts + Base64 для экспорта в видео)
 * ========================================================================== */

const SYSTEM_FONTS = new Set([
  'arial', 'helvetica', 'times new roman', 'courier new',
  'georgia', 'verdana', 'tahoma', 'trebuchet ms', 'impact',
  'sans-serif', 'serif', 'monospace', 'cursive', 'fantasy',
]);

const fontCssCache = new Map();

const blobToDataUrl = (blob) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onloadend = () => resolve(reader.result);
  reader.readAsDataURL(blob);
});

/** Заменяет ссылки на файлы шрифтов в CSS на Base64 data-URL. */
async function embedFontUrls(css) {
  let embedded = css;
  const urls = [...css.matchAll(/url\((https:\/\/[^)]+)\)/g)].map((m) => m[1]);
  for (const fontUrl of urls) {
    try {
      const res = await fetch(fontUrl);
      if (!res.ok) continue;
      embedded = embedded.split(fontUrl).join(await blobToDataUrl(await res.blob()));
    } catch (err) {
      console.warn('Не удалось встроить файл шрифта:', fontUrl, err);
    }
  }
  return embedded;
}

async function loadGoogleFontCss(family) {
  const url = 'https://fonts.googleapis.com/css?family='
    + encodeURIComponent(family).replace(/%20/g, '+') + '&display=swap';
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);

  const rawCss = await res.text();
  // Оставляем только блоки для кириллицы и базовой латиницы
  const filtered = rawCss
    .split('/*')
    .filter((block) => block.trim())
    .map((block) => '/*' + block)
    .filter((block) => block.includes('cyrillic */') || block.includes('latin */'))
    .join('\n');

  return embedFontUrls(filtered || rawCss);
}

async function ensureFontsLoaded(fontsList) {
  for (const { fFamily: family } of fontsList) {
    if (!family || SYSTEM_FONTS.has(family.toLowerCase()) || fontCssCache.has(family)) continue;
    try {
      const css = await loadGoogleFontCss(family);
      fontCssCache.set(family, css);

      const styleTag = document.createElement('style');
      styleTag.setAttribute('data-lottie-font', family);
      styleTag.textContent = css;
      document.head.appendChild(styleTag);

      if (document.fonts && document.fonts.load) {
        await document.fonts.load('16px "' + family + '"');
      }
    } catch (err) {
      console.warn('Шрифт не найден в Google Fonts (будет использован системный):', family, err);
    }
  }
}

/* ============================================================================
 * 6. UI, ПЛЕЕР И ЭКСПОРТ
 * ========================================================================== */

const STORAGE_KEY = 'lsl_lottie_studio:dsl';
const SVG_NS = 'http://www.w3.org/2000/svg';

const els = {
  editor: document.getElementById('dsl-editor'),
  errorBox: document.getElementById('error-box'),
  lottieBox: document.getElementById('lottie-box'),
  stageWrap: document.getElementById('stage-wrap'),
  rawJson: document.getElementById('raw-json-view'),
  scrubber: document.getElementById('scrubber'),
  timecode: document.getElementById('timecode'),
  btnCompile: document.getElementById('btn-compile'),
  btnPlay: document.getElementById('btn-play'),
  btnSaveDsl: document.getElementById('btn-save-dsl'),
  btnLoadDsl: document.getElementById('btn-load-dsl'),
  fileDsl: document.getElementById('file-dsl'),
  btnResetDsl: document.getElementById('btn-reset-dsl'),
  btnSaveLottie: document.getElementById('btn-save-lottie'),
  btnExport: document.getElementById('btn-export-video'),
  tabPreview: document.getElementById('tab-preview'),
  tabRaw: document.getElementById('tab-raw'),
  recBadge: document.getElementById('rec-badge'),
};

const state = {
  anim: null,
  lottieData: null,
  isPlaying: true,
  isExporting: false,
};

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function showError(message) {
  els.errorBox.textContent = message;
  els.errorBox.classList.add('visible');
}

function hideError() {
  els.errorBox.textContent = '';
  els.errorBox.classList.remove('visible');
}

function fitStageBox(w, h) {
  const rect = els.stageWrap.getBoundingClientRect();
  const scale = Math.min(Math.max(120, rect.width - 40) / w, Math.max(120, rect.height - 40) / h, 1);
  els.lottieBox.style.width = Math.round(w * scale) + 'px';
  els.lottieBox.style.height = Math.round(h * scale) + 'px';
}

function updateTimeUI() {
  if (!state.anim || !state.lottieData) return;
  const { currentFrame: frame, totalFrames } = state.anim;
  const fps = state.lottieData.fr;
  els.scrubber.value = Math.round(frame);
  els.timecode.textContent = (frame / fps).toFixed(2) + ' / ' + (totalFrames / fps).toFixed(2) + 's';
}

function pausePlayback() {
  if (!state.anim) return;
  state.anim.pause();
  state.isPlaying = false;
  els.btnPlay.textContent = '▶ Старт';
}

function resumePlayback() {
  if (!state.anim) return;
  state.anim.play();
  state.isPlaying = true;
  els.btnPlay.textContent = '⏸ Пауза';
}

async function compileAndRun() {
  if (typeof lottie === 'undefined') {
    showError('Библиотека lottie-web не загружена. Проверьте подключение к CDN.');
    return;
  }
  try {
    const compiled = compileToLottie(parseDSL(els.editor.value));

    // Шрифты подгружаем до инициализации плеера
    await ensureFontsLoaded(compiled.fonts.list);

    state.lottieData = compiled;
    localStorage.setItem(STORAGE_KEY, els.editor.value);
    hideError();
    els.rawJson.textContent = JSON.stringify(compiled, null, 2);

    if (state.anim) state.anim.destroy();
    els.lottieBox.innerHTML = '';
    fitStageBox(compiled.w, compiled.h);

    state.anim = lottie.loadAnimation({
      container: els.lottieBox,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      animationData: JSON.parse(JSON.stringify(compiled)),
      rendererSettings: {
        preserveAspectRatio: 'xMidYMid meet',
        progressiveLoad: false,
      },
    });
    state.isPlaying = true;
    els.btnPlay.textContent = '⏸ Пауза';
    els.scrubber.max = Math.max(1, compiled.op - 1);
    state.anim.addEventListener('enterFrame', updateTimeUI);
  } catch (err) {
    showError('Ошибка компиляции: ' + err.message);
  }
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/** Рисует текущий SVG-кадр плеера на offscreen-canvas. */
function renderSvgFrameToCanvas(ctx, width, height, fontDefs) {
  return new Promise((resolve) => {
    const svgEl = els.lottieBox.querySelector('svg');
    if (!svgEl) { resolve(); return; }

    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', SVG_NS);
    clone.setAttribute('width', width);
    clone.setAttribute('height', height);
    if (fontDefs) clone.insertBefore(fontDefs.cloneNode(true), clone.firstChild);

    const svgBlob = new Blob(
      [new XMLSerializer().serializeToString(clone)],
      { type: 'image/svg+xml;charset=utf-8' }
    );
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve();
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    img.src = url;
  });
}

function pickRecorderMime() {
  if (!window.MediaRecorder) return null;
  const candidates = [
    'video/mp4;codecs="avc1.42E01E"',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  return candidates.find((m) => MediaRecorder.isTypeSupported(m)) || null;
}

/** Плавный покадровый экспорт: captureStream(0) + Base64-шрифты в SVG. */
async function exportVideo() {
  if (!state.lottieData || !state.anim || state.isExporting) return;

  const mime = pickRecorderMime();
  if (!mime) {
    alert('Ваш браузер не поддерживает MediaRecorder для записи видео.');
    return;
  }

  els.tabPreview.click();
  state.isExporting = true;
  pausePlayback();
  els.recBadge.classList.add('on');
  els.btnExport.disabled = true;

  const { w, h, fr: fps, op: totalFrames } = state.lottieData;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Шрифты встраиваются в SVG-кадры как Base64, иначе при рендере пропадут
  let fontDefs = null;
  if (fontCssCache.size > 0) {
    fontDefs = document.createElementNS(SVG_NS, 'defs');
    const style = document.createElementNS(SVG_NS, 'style');
    style.setAttribute('type', 'text/css');
    style.textContent = [...fontCssCache.values()].join('\n');
    fontDefs.appendChild(style);
  }

  const stream = canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  const stopped = new Promise((resolve) => { recorder.onstop = resolve; });
  recorder.start();

  const frameDelay = 1000 / fps;
  for (let f = 0; f < totalFrames; f++) {
    const t0 = performance.now();
    state.anim.goToAndStop(f, true);
    await renderSvgFrameToCanvas(ctx, w, h, fontDefs);
    if (track && typeof track.requestFrame === 'function') track.requestFrame();

    els.scrubber.value = f;
    els.timecode.textContent = (f / fps).toFixed(2) + ' / ' + (totalFrames / fps).toFixed(2) + 's';

    await sleep(Math.max(0, frameDelay - (performance.now() - t0)));
  }

  await sleep(150);
  recorder.stop();
  await stopped;

  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  downloadBlob(new Blob(chunks, { type: mime }), 'lottie_export.' + ext);

  state.isExporting = false;
  els.recBadge.classList.remove('on');
  els.btnExport.disabled = false;
  resumePlayback();
}

/* ---------- Привязка событий ---------- */

els.btnCompile.addEventListener('click', compileAndRun);

els.btnSaveDsl.addEventListener('click', () => {
  downloadBlob(new Blob([els.editor.value], { type: 'text/plain;charset=utf-8' }), 'animation.lsl');
});

els.btnLoadDsl.addEventListener('click', () => els.fileDsl.click());

els.fileDsl.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    els.editor.value = ev.target.result;
    compileAndRun();
  };
  reader.readAsText(file);
  e.target.value = '';
});

els.btnResetDsl.addEventListener('click', () => {
  els.editor.value = DEFAULT_DSL;
  compileAndRun();
});

els.btnSaveLottie.addEventListener('click', () => {
  if (!state.lottieData) return;
  const json = JSON.stringify(state.lottieData, null, 2);
  downloadBlob(new Blob([json], { type: 'application/json' }), 'animation.lottie.json');
});

els.btnPlay.addEventListener('click', () => {
  if (!state.anim || state.isExporting) return;
  state.isPlaying ? pausePlayback() : resumePlayback();
});

els.scrubber.addEventListener('input', () => {
  if (!state.anim || state.isExporting) return;
  pausePlayback();
  state.anim.goToAndStop(Number(els.scrubber.value), true);
  updateTimeUI();
});

els.tabPreview.addEventListener('click', () => {
  els.tabPreview.classList.add('active');
  els.tabRaw.classList.remove('active');
  els.stageWrap.style.display = 'flex';
  els.rawJson.style.display = 'none';
});

els.tabRaw.addEventListener('click', () => {
  els.tabRaw.classList.add('active');
  els.tabPreview.classList.remove('active');
  els.stageWrap.style.display = 'none';
  els.rawJson.style.display = 'block';
});

els.btnExport.addEventListener('click', exportVideo);

els.editor.addEventListener('keydown', (e) => {
  if (e.code === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    compileAndRun();
  }
});

window.addEventListener('resize', () => {
  if (state.lottieData) fitStageBox(state.lottieData.w, state.lottieData.h);
});

els.editor.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_DSL;
compileAndRun();
</script>
</body>
</html>
