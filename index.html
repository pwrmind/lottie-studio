<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL-DSL → Lottie Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1117;
    --panel: #161922;
    --panel2: #1e222d;
    --border: #2b3040;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }
  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
    height: 100vh;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--accent);
    margin-right: auto;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.15s;
  }
  button:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.primary {
    background: var(--accent);
    color: #090d16;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) {
    background: var(--accent-hover);
    color: #fff;
  }
  button.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--danger);
    color: #fca5a5;
  }
  button.danger:hover:not(:disabled) {
    background: var(--danger);
    color: #fff;
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .tabs {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .tabs button {
    border: none;
    border-radius: 0;
    padding: 5px 10px;
    background: transparent;
    color: var(--text-dim);
  }
  .tabs button.active {
    background: var(--accent);
    color: #090d16;
    font-weight: 600;
  }

  /* Left: DSL Editor */
  textarea.code-area {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--bg);
    color: #cbd5e1;
    font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
    padding: 14px;
    tab-size: 2;
  }
  .error-banner {
    display: none;
    padding: 8px 14px;
    background: #3b1219;
    color: #fda4af;
    border-top: 1px solid #be123c;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
  .error-banner.visible { display: block; }

  /* Right: Preview & Raw JSON */
  .view-container {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #090b10;
  }
  .stage-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    background-image: radial-gradient(#1e2433 1px, transparent 1px);
    background-size: 16px 16px;
  }
  #lottie-box {
    background: #111520;
    border: 2px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lottie-box svg {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }
  .raw-json {
    flex: 1;
    margin: 0;
    padding: 14px;
    overflow: auto;
    background: var(--bg);
    color: #86efac;
    font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.5;
    display: none;
  }
  .player-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--panel2);
    border-top: 1px solid var(--border);
  }
  .player-bar input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .timecode {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--accent);
    min-width: 95px;
    text-align: right;
  }
  .rec-badge {
    display: none;
    align-items: center;
    gap: 6px;
    color: #fca5a5;
    font-size: 12px;
    font-weight: 600;
  }
  .rec-badge.on { display: inline-flex; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger);
    animation: pulse 0.9s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.2; } }
</style>
</head>
<body>

<div class="workspace">
  <!-- ================= ЛЕВАЯ ПАНЕЛЬ: SQL-DSL ================= -->
  <section class="panel">
    <div class="toolbar">
      <span class="toolbar-title">SQL-DSL Сценарий</span>
      <button class="primary" id="btn-compile" title="Ctrl + Enter">▶ Собрать</button>
      <button id="btn-save-dsl" title="Скачать файл .sql">💾 Сохранить DSL</button>
      <button id="btn-load-dsl" title="Загрузить скрипт">📂 Открыть</button>
      <button id="btn-reset-dsl" title="Вернуть демо-пример">↺ Пример</button>
      <input type="file" id="file-dsl" accept=".sql,.txt" style="display:none">
    </div>
    <textarea class="code-area" id="dsl-editor" spellcheck="false"></textarea>
    <div class="error-banner" id="error-box"></div>
  </section>

  <!-- ================= ПРАВАЯ ПАНЕЛЬ: LOTTIE & RAW ================= -->
  <section class="panel">
    <div class="toolbar">
      <span class="toolbar-title">Lottie Студия</span>
      <div class="tabs">
        <button class="active" id="tab-preview">🎬 Превью</button>
        <button id="tab-raw">{ } Raw Lottie</button>
      </div>
      <button id="btn-save-lottie">⬇ Lottie .json</button>
      <button class="danger" id="btn-export-video">⏺ Видео</button>
    </div>

    <div class="view-container">
      <div class="stage-wrap" id="stage-wrap">
        <div id="lottie-box"></div>
      </div>
      <pre class="raw-json" id="raw-json-view"></pre>
    </div>

    <div class="player-bar">
      <button id="btn-play">⏸ Пауза</button>
      <input type="range" id="scrubber" min="0" max="100" value="0" step="1">
      <span class="timecode" id="timecode">0.00 / 0.00s</span>
      <span class="rec-badge" id="rec-badge"><span class="dot"></span>Рендер видео…</span>
    </div>
  </section>
</div>

<script>
'use strict';

/* ============================================================================
 * 1. ДЕМО-СЦЕНАРИЙ ПО УМОЛЧАНИЮ
 * ============================================================================ */
const DEFAULT_DSL = [
  "-- Настройка композиции Lottie (холст 9:16 для Shorts / Reels)",
  "UPDATE composition SET width = 540, height = 960, fps = 60, duration = 6.5;",
  "",
  "-- Наполнение пустого канваса объектами (rect, ellipse, text)",
  "INSERT INTO layers (id, type, x, y, width, height, color, radius, opacity) VALUES",
  "  ('bg',       'rect',    270, 480, 540, 960, '#0b1021', 0,   100),",
  "  ('glow',     'ellipse', 270, 460, 320, 320, '#1d4ed8', 0,   25),",
  "  ('card',     'rect',    270, 480, 420, 260, '#1e293b', 28,  0),",
  "  ('badge',    'rect',    270, 395, 160, 38,  '#38bdf8', 19,  0),",
  "  ('dot',      'ellipse', 140, 650, 36,  36,  '#f43f5e', 0,   100);",
  "",
  "INSERT INTO layers (id, type, text, x, y, size, color, opacity) VALUES",
  "  ('tag',      'text', 'SQL -> LOTTIE',     270, 402, 16, '#090d16', 0),",
  "  ('title',    'text', 'Движок анимации',   270, 475, 34, '#f8fafc', 0),",
  "  ('subtitle', 'text', 'Компиляция из DSL', 270, 525, 20, '#94a3b8', 0);",
  "",
  "-- Появление карточки и плавный подъём",
  "UPDATE layers SET opacity = 100, y = 460 WHERE id = 'card'     AT 0.3 WITH (duration = 0.7, ease = 'out');",
  "UPDATE layers SET opacity = 100, y = 375 WHERE id = 'badge'    AT 0.6 WITH (duration = 0.5, ease = 'out');",
  "UPDATE layers SET opacity = 100, y = 381 WHERE id = 'tag'      AT 0.6 WITH (duration = 0.5, ease = 'out');",
  "",
  "-- Выезд заголовков",
  "UPDATE layers SET opacity = 100, y = 455 WHERE id = 'title'    AT 0.9 WITH (duration = 0.6, ease = 'out');",
  "UPDATE layers SET opacity = 100, y = 505 WHERE id = 'subtitle' AT 1.1 WITH (duration = 0.6, ease = 'out');",
  "",
  "-- Динамика индикатора и пульсация фонового свечения",
  "UPDATE layers SET x = 400, color = '#22c55e' WHERE id = 'dot'  AT 1.5 WITH (duration = 1.2, ease = 'inOut');",
  "UPDATE layers SET scale = 145, opacity = 45  WHERE id = 'glow' AT 1.5 WITH (duration = 1.5, ease = 'inOut');",
  "UPDATE layers SET scale = 100, opacity = 25  WHERE id = 'glow' AT 3.0 WITH (duration = 1.5, ease = 'inOut');",
  "",
  "-- Акцентный поворот карточки и возврат",
  "UPDATE layers SET rotation = -4, scale = 104 WHERE id = 'card' AT 3.2 WITH (duration = 0.5, ease = 'inOut');",
  "UPDATE layers SET rotation = 0,  scale = 100 WHERE id = 'card' AT 3.8 WITH (duration = 0.5, ease = 'inOut');",
  "",
  "-- Плавное затухание в конце",
  "UPDATE layers SET opacity = 0 WHERE id IN ('card', 'badge', 'tag', 'title', 'subtitle', 'dot') AT 5.5 WITH (duration = 0.8, ease = 'in');"
].join('\n');

/* ============================================================================
 * 2. ПАРСЕР SQL-DSL
 * ============================================================================ */
function splitTopLevel(str, sep) {
  sep = sep || ',';
  const res = [];
  let cur = '', quote = null, depth = 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charAt(i);
    if (quote) {
      cur += ch;
      if (ch === quote && str.charAt(i - 1) !== '\\') quote = null;
    } else {
      if (ch === "'" || ch === '"') quote = ch;
      else if (ch === '(') depth++;
      else if (ch === ')') depth--;
      if (ch === sep && depth === 0) {
        res.push(cur.trim());
        cur = '';
        continue;
      }
      cur += ch;
    }
  }
  if (cur.trim()) res.push(cur.trim());
  return res;
}

function parseValue(raw) {
  const s = raw.trim();
  if ((s.startsWith("'") && s.endsWith("'")) || (s.startsWith('"') && s.endsWith('"'))) {
    return s.slice(1, -1);
  }
  if (s === 'true') return true;
  if (s === 'false') return false;
  if (!isNaN(Number(s)) && s !== '') return Number(s);
  return s;
}

function parseAssignments(str) {
  const obj = {};
  for (const part of splitTopLevel(str, ',')) {
    const eq = part.indexOf('=');
    if (eq === -1) throw new Error('Ожидалось присваивание "ключ = значение" в: ' + part);
    const k = part.slice(0, eq).trim();
    const v = part.slice(eq + 1).trim();
    obj[k] = parseValue(v);
  }
  return obj;
}

function parseDSL(sqlText) {
  const cleaned = sqlText
    .split('\n')
    .map(function(line) {
      let inStr = false, q = '';
      for (let i = 0; i < line.length - 1; i++) {
        const c = line.charAt(i);
        if (inStr) { if (c === q) inStr = false; }
        else if (c === "'" || c === '"') { inStr = true; q = c; }
        else if (c === '-' && line.charAt(i + 1) === '-') return line.slice(0, i);
      }
      return line;
    })
    .join('\n');

  const statements = splitTopLevel(cleaned, ';');
  const comp = { width: 540, height: 960, fps: 60, duration: 5.0 };
  const layers = new Map();
  const updates = [];

  for (let idx = 0; idx < statements.length; idx++) {
    const stmt = statements.at(idx).trim();
    if (!stmt) continue;

    // 1. INSERT INTO layers (cols) VALUES (vals), (vals)...
    const insMatch = stmt.match(/^INSERT\s+INTO\s+layers\s*\(([^)]+)\)\s*VALUES\s*(.+)$/is);
    if (insMatch) {
      const cols = splitTopLevel(insMatch.at(1), ',').map(function(c) { return c.trim(); });
      const rowsRaw = insMatch.at(2).trim();
      const tuples = [];
      let depth = 0, start = -1, quote = null;
      for (let i = 0; i < rowsRaw.length; i++) {
        const ch = rowsRaw.charAt(i);
        if (quote) { if (ch === quote) quote = null; continue; }
        if (ch === "'" || ch === '"') { quote = ch; continue; }
        if (ch === '(') { if (depth === 0) start = i + 1; depth++; }
        else if (ch === ')') {
          depth--;
          if (depth === 0 && start !== -1) {
            tuples.push(rowsRaw.slice(start, i));
            start = -1;
          }
        }
      }
      for (const tup of tuples) {
        const vals = splitTopLevel(tup, ',').map(parseValue);
        if (vals.length !== cols.length) {
          throw new Error('Количество значений (' + vals.length + ') не совпадает с колонками (' + cols.length + ')');
        }
        const rowObj = {
          type: 'rect', x: 0, y: 0, width: 100, height: 100,
          scale: 100, rotation: 0, opacity: 100, color: '#ffffff',
          radius: 0, text: '', size: 24
        };
        cols.forEach(function(c, i) { rowObj[c] = vals.at(i); });
        if (!rowObj.id) throw new Error('У каждого слоя в INSERT должен быть указан id');
        layers.set(rowObj.id, rowObj);
      }
      continue;
    }

    // 2. UPDATE composition SET ...
    const compMatch = stmt.match(/^UPDATE\s+composition\s+SET\s+(.+)$/is);
    if (compMatch) {
      Object.assign(comp, parseAssignments(compMatch.at(1)));
      continue;
    }

    // 3. UPDATE layers SET ... [WHERE ...] [AT t] [WITH (...)]
    const updMatch = stmt.match(
      /^UPDATE\s+layers\s+SET\s+(.+?)(?:\s+WHERE\s+(.+?))?(?:\s+AT\s+([\d.]+))?(?:\s+WITH\s*\((.+)\))?$/is
    );
    if (updMatch) {
      const setObj = parseAssignments(updMatch.at(1));
      const whereRaw = updMatch.at(2);
      const atTime = updMatch.at(3) !== undefined ? parseFloat(updMatch.at(3)) : 0;
      const withObj = updMatch.at(4) ? parseAssignments(updMatch.at(4)) : {};

      let targetIds = null;
      if (whereRaw) {
        const inMatch = whereRaw.match(/^id\s+IN\s*\((.+)\)$/i);
        const eqMatch = whereRaw.match(/^id\s*=\s*(.+)$/i);
        if (inMatch) {
          targetIds = splitTopLevel(inMatch.at(1), ',').map(parseValue);
        } else if (eqMatch) {
          targetIds = Array.of(parseValue(eqMatch.at(1)));
        } else {
          throw new Error('Неподдерживаемое условие WHERE: ' + whereRaw);
        }
      }

      updates.push({
        t: atTime,
        dur: Number(withObj.duration !== undefined ? withObj.duration : (withObj.dur !== undefined ? withObj.dur : 0)),
        ease: String(withObj.ease !== undefined ? withObj.ease : 'inOut'),
        targetIds: targetIds,
        set: setObj
      });
      continue;
    }

    throw new Error('Неизвестная инструкция SQL: ' + stmt.slice(0, 60));
  }

  return { comp: comp, layers: layers, updates: updates };
}

/* ============================================================================
 * 3. КОМПИЛЯТОР В LOTTIE JSON (BODIMOVIN FORMAT)
 * ============================================================================ */
const EASING_MAP = {
  linear: { i: { x: Array.of(0),    y: Array.of(1) }, o: { x: Array.of(0),    y: Array.of(0) } },
  in:     { i: { x: Array.of(0),    y: Array.of(1) }, o: { x: Array.of(0.42), y: Array.of(0) } },
  out:    { i: { x: Array.of(0.58), y: Array.of(1) }, o: { x: Array.of(0),    y: Array.of(0) } },
  inOut:  { i: { x: Array.of(0.42), y: Array.of(1) }, o: { x: Array.of(0.58), y: Array.of(0) } }
};

function hexToLottieColor(hex) {
  let c = String(hex).replace('#', '').trim();
  if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
  const num = parseInt(c, 16);
  if (isNaN(num)) return Array.of(1, 1, 1, 1);
  return Array.of(
    +(((num >> 16) & 255) / 255).toFixed(4),
    +(((num >> 8) & 255) / 255).toFixed(4),
    +((num & 255) / 255).toFixed(4),
    1
  );
}

function buildKeyframes(events, initialVal, fps, isArray) {
  const sorted = events.slice().sort(function(a, b) { return a.t - b.t; });
  if (sorted.length === 0) {
    return { a: 0, k: isArray ? initialVal.slice() : initialVal };
  }

  const kf = [];
  let curVal = initialVal;

  for (const ev of sorted) {
    const startFrame = Math.round(ev.t * fps);
    const durFrames = Math.round(ev.dur * fps);
    const endFrame = startFrame + durFrames;
    const ease = EASING_MAP[ev.ease] || EASING_MAP.inOut;

    if (durFrames <= 0) {
      kf.push({
        t: startFrame,
        s: isArray ? ev.val.slice() : Array.of(ev.val),
        h: 1
      });
      curVal = ev.val;
    } else {
      const last = kf.length > 0 ? kf.at(kf.length - 1) : null;

if (!last || last.t < startFrame) {
kf.push({
t: startFrame,
s: isArray ? curVal.slice() : Array.of(curVal),
i: ease.i,
o: ease.o
});
} else if (last.t === startFrame) {
delete last.h;
last.i = ease.i;
last.o = ease.o;
}
kf.push({
t: endFrame,
s: isArray ? ev.val.slice() : Array.of(ev.val)
});
curVal = ev.val;
}
}
return { a: 1, k: kf };
}
function compileToLottie(parsed) {
const comp = parsed.comp;
const layers = parsed.layers;
const updates = parsed.updates;
const fps = comp.fps || 60;
const totalFrames = Math.max(1, Math.round((comp.duration || 5) * fps));
const lottieLayers = [];
let ind = 1;
const layerList = Array.from(layers.values()).reverse();
for (const layer of layerList) {
const myUpdates = updates.filter(function(u) {
return !u.targetIds || u.targetIds.includes(layer.id);
});
const posEvents = [];
const scaleEvents = [];
const rotEvents = [];
const opEvents = [];
const colorEvents = [];
let curX = layer.x, curY = layer.y;
let curScale = layer.scale;
for (const u of myUpdates) {
if (u.set.x !== undefined || u.set.y !== undefined) {
const nx = u.set.x !== undefined ? u.set.x : curX;
const ny = u.set.y !== undefined ? u.set.y : curY;
posEvents.push({ t: u.t, dur: u.dur, ease: u.ease, val: Array.of(nx, ny, 0) });
curX = nx; curY = ny;
}
if (u.set.scale !== undefined) {
curScale = u.set.scale;
scaleEvents.push({ t: u.t, dur: u.dur, ease: u.ease, val: Array.of(curScale, curScale, 100) });
}
if (u.set.rotation !== undefined) {
rotEvents.push({ t: u.t, dur: u.dur, ease: u.ease, val: u.set.rotation });
}
if (u.set.opacity !== undefined) {
opEvents.push({ t: u.t, dur: u.dur, ease: u.ease, val: u.set.opacity });
}
if (u.set.color !== undefined) {
colorEvents.push({ t: u.t, dur: u.dur, ease: u.ease, val: hexToLottieColor(u.set.color) });
}
}
const ks = {
o: buildKeyframes(opEvents, layer.opacity, fps, false),
r: buildKeyframes(rotEvents, layer.rotation, fps, false),
p: buildKeyframes(posEvents, Array.of(layer.x, layer.y, 0), fps, true),
a: { a: 0, k: Array.of(0, 0, 0) },
s: buildKeyframes(scaleEvents, Array.of(layer.scale, layer.scale, 100), fps, true)
};
const baseLayer = {
ddd: 0,
ind: ind++,
nm: layer.id,
sr: 1,
ks: ks,
ao: 0,
ip: 0,
op: totalFrames,
st: 0,
bm: 0
};
if (layer.type === 'text') {
lottieLayers.push(Object.assign({}, baseLayer, {
ty: 5,
t: {
d: {
k: Array.of({
s: {
s: layer.size || 24,
f: 'Arial',
t: String(layer.text || ''),
j: 2,
tr: 0,
lh: (layer.size || 24) * 1.2,
ls: 0,
fc: hexToLottieColor(layer.color).slice(0, 3)
},
t: 0
})
},
p: {},
m: { g: 1, a: { a: 0, k: Array.of(0, 0) } },
a: new Array()
}
}));
} else {
const shapeGeom = layer.type === 'ellipse'
? {
ty: 'el',
d: 1,
s: { a: 0, k: Array.of(layer.width, layer.height) },
p: { a: 0, k: Array.of(0, 0) },
nm: 'Ellipse'
}
: {
ty: 'rc',
d: 1,
s: { a: 0, k: Array.of(layer.width, layer.height) },
p: { a: 0, k: Array.of(0, 0) },
r: { a: 0, k: layer.radius || 0 },
nm: 'Rectangle'
};
const fillProp = {
ty: 'fl',
c: buildKeyframes(colorEvents, hexToLottieColor(layer.color), fps, true),
o: { a: 0, k: 100 },
r: 1,
bm: 0,
nm: 'Fill'
};
lottieLayers.push(Object.assign({}, baseLayer, {
ty: 4,
shapes: Array.of({
ty: 'gr',
it: Array.of(
shapeGeom,
fillProp,
{
ty: 'tr',
p: { a: 0, k: Array.of(0, 0) },
a: { a: 0, k: Array.of(0, 0) },
s: { a: 0, k: Array.of(100, 100) },
r: { a: 0, k: 0 },
o: { a: 0, k: 100 }
}
),
nm: 'Group'
})
}));
}
}
return {
  v: '5.12.2',
  fr: fps,
  ip: 0,
  op: totalFrames,
  w: comp.width,
  h: comp.height,
  nm: 'SQL_DSL_Animation',
  ddd: 0,
  assets: new Array(),
  fonts: {
    list: Array.of({
      fName: 'Arial',
      fFamily: 'Arial',
      fStyle: 'Regular',
      ascent: 75
    })
  },
  layers: lottieLayers
};
}
/* ============================================================================
• 
	4. UI, ПЛЕЕР И ЭКСПОРТ
• ============================================================================ */
const STORAGE_KEY = 'sql_lottie_studio:dsl';
const editor = document.getElementById('dsl-editor');
const errorBox = document.getElementById('error-box');
const lottieBox = document.getElementById('lottie-box');
const stageWrap = document.getElementById('stage-wrap');
const rawJsonView = document.getElementById('raw-json-view');
const scrubber = document.getElementById('scrubber');
const timecode = document.getElementById('timecode');
const btnPlay = document.getElementById('btn-play');
const recBadge = document.getElementById('rec-badge');
let anim = null;
let currentLottieData = null;
let isPlaying = true;
let isExporting = false;
editor.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_DSL;
function fitStageBox(w, h) {
const wrapRect = stageWrap.getBoundingClientRect();
const maxW = Math.max(120, wrapRect.width - 40);
const maxH = Math.max(120, wrapRect.height - 40);
const scale = Math.min(maxW / w, maxH / h, 1);
lottieBox.style.width = Math.round(w * scale) + 'px';
lottieBox.style.height = Math.round(h * scale) + 'px';
}
window.addEventListener('resize', function() {
if (currentLottieData) fitStageBox(currentLottieData.w, currentLottieData.h);
});
function updateTimeUI() {
if (!anim || !currentLottieData) return;
const frame = anim.currentFrame;
const total = anim.totalFrames;
const fps = currentLottieData.fr;
scrubber.value = Math.round(frame);
timecode.textContent = (frame / fps).toFixed(2) + ' / ' + (total / fps).toFixed(2) + 's';
}
function compileAndRun() {
try {
if (typeof lottie === 'undefined') {
throw new Error('Библиотека lottie-web не загружена. Проверьте подключение к CDN.');
}
const parsed = parseDSL(editor.value);
currentLottieData = compileToLottie(parsed);
localStorage.setItem(STORAGE_KEY, editor.value);
errorBox.classList.remove('visible');
errorBox.textContent = '';
rawJsonView.textContent = JSON.stringify(currentLottieData, null, 2);
if (anim) anim.destroy();
lottieBox.innerHTML = '';
fitStageBox(currentLottieData.w, currentLottieData.h);
anim = lottie.loadAnimation({
  container: lottieBox,
  renderer: 'svg',
  loop: true,
  autoplay: true,
  animationData: JSON.parse(JSON.stringify(currentLottieData)),
  rendererSettings: {
    preserveAspectRatio: 'xMidYMid meet',
    progressiveLoad: false
  }
});
isPlaying = true;
btnPlay.textContent = '⏸ Пауза';
scrubber.max = Math.max(1, currentLottieData.op - 1);
anim.addEventListener('enterFrame', updateTimeUI);
} catch (err) {
errorBox.textContent = 'Ошибка компиляции: ' + err.message;
errorBox.classList.add('visible');
}
}
const tabPreview = document.getElementById('tab-preview');
const tabRaw = document.getElementById('tab-raw');
tabPreview.addEventListener('click', function() {
tabPreview.classList.add('active');
tabRaw.classList.remove('active');
stageWrap.style.display = 'flex';
rawJsonView.style.display = 'none';
});
tabRaw.addEventListener('click', function() {
tabRaw.classList.add('active');
tabPreview.classList.remove('active');
stageWrap.style.display = 'none';
rawJsonView.style.display = 'block';
});
btnPlay.addEventListener('click', function() {
if (!anim || isExporting) return;
if (isPlaying) {
anim.pause();
isPlaying = false;
btnPlay.textContent = '▶ Старт';
} else {
anim.play();
isPlaying = true;
btnPlay.textContent = '⏸ Пауза';
}
});
scrubber.addEventListener('input', function() {
if (!anim || isExporting) return;
anim.pause();
isPlaying = false;
btnPlay.textContent = '▶ Старт';
anim.goToAndStop(Number(scrubber.value), true);
updateTimeUI();
});
function downloadBlob(blob, filename) {
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = filename;
document.body.appendChild(a);
a.click();
setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
document.getElementById('btn-compile').addEventListener('click', compileAndRun);
document.getElementById('btn-save-dsl').addEventListener('click', function() {
downloadBlob(new Blob(Array.of(editor.value), { type: 'text/plain;charset=utf-8' }), 'animation.sql');
});
document.getElementById('btn-load-dsl').addEventListener('click', function() {
document.getElementById('file-dsl').click();
});
document.getElementById('file-dsl').addEventListener('change', function(e) {
const file = e.target.files.item(0);
if (!file) return;
const reader = new FileReader();
reader.onload = function(ev) {
editor.value = ev.target.result;
compileAndRun();
};
reader.readAsText(file);
e.target.value = '';
});
document.getElementById('btn-reset-dsl').addEventListener('click', function() {
editor.value = DEFAULT_DSL;
compileAndRun();
});
document.getElementById('btn-save-lottie').addEventListener('click', function() {
if (!currentLottieData) return;
const json = JSON.stringify(currentLottieData, null, 2);
downloadBlob(new Blob(Array.of(json), { type: 'application/json' }), 'animation.lottie.json');
});
editor.addEventListener('keydown', function(e) {
if (e.code === 'Enter' && (e.ctrlKey || e.metaKey)) {
e.preventDefault();
compileAndRun();
}
});
/* ============================================================================
• 
	5. ПОКАДРОВЫЙ ЭКСПОРТ ВИДЕО ИЗ LOTTIE
• ============================================================================ */
document.getElementById('btn-export-video').addEventListener('click', async function() {
if (!currentLottieData || isExporting) return;
const mimeCandidates = Array.of(
'video/webm;codecs=vp9',
'video/webm;codecs=vp8',
'video/webm',
'video/mp4'
);
const mime = mimeCandidates.find(function(m) {
return window.MediaRecorder && MediaRecorder.isTypeSupported(m);
});
if (!mime) {
alert('Ваш браузер не поддерживает MediaRecorder для записи видео.');
return;
}
isExporting = true;
if (anim) anim.pause();
isPlaying = false;
btnPlay.textContent = '▶ Старт';
recBadge.classList.add('on');
document.getElementById('btn-export-video').disabled = true;
const w = currentLottieData.w;
const h = currentLottieData.h;
const fps = currentLottieData.fr;
const totalFrames = currentLottieData.op;
const offDiv = document.createElement('div');
offDiv.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + w + 'px;height:' + h + 'px;';
document.body.appendChild(offDiv);
const offAnim = lottie.loadAnimation({
container: offDiv,
renderer: 'canvas',
loop: false,
autoplay: false,
animationData: JSON.parse(JSON.stringify(currentLottieData)),
rendererSettings: { clearCanvas: true, preserveDrawingBuffer: true }
});
await new Promise(function(r) { offAnim.addEventListener('DOMLoaded', r, { once: true }); });
const canvas = offDiv.querySelector('canvas');
const stream = canvas.captureStream(0);
const track = stream.getVideoTracks().at(0);
const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
const chunks = [];
recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
const donePromise = new Promise(function(resolve) { recorder.onstop = resolve; });
recorder.start();
const frameDelay = 1000 / fps;
for (let f = 0; f < totalFrames; f++) {
offAnim.goToAndStop(f, true);
if (track && track.requestFrame) track.requestFrame();
scrubber.value = f;
timecode.textContent = (f / fps).toFixed(2) + ' / ' + (totalFrames / fps).toFixed(2) + 's';
await new Promise(function(r) { setTimeout(r, frameDelay); });
}
recorder.stop();
await donePromise;
offAnim.destroy();
offDiv.remove();
const ext = mime.includes('mp4') ? 'mp4' : 'webm';
downloadBlob(new Blob(chunks, { type: mime }), 'lottie_export.' + ext);
isExporting = false;
recBadge.classList.remove('on');
document.getElementById('btn-export-video').disabled = false;
if (anim) { anim.play(); isPlaying = true; btnPlay.textContent = '⏸ Пауза'; }
});
compileAndRun();

</script>
